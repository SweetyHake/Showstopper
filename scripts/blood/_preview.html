<!DOCTYPE html>
<!-- DEV ONLY: visual preview of the blood atlas. Open via an HTTP server rooted
     at the module directory: /scripts/blood/_preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 12px sans-serif; background: #14181c; color: #ccc; }
  .band { padding: 16px; }
  .band.dark { background: repeating-conic-gradient(#23282e 0% 25%, #1b2025 0% 50%) 0 0/64px 64px; }
  .band.paper { background: linear-gradient(160deg, #cdbf9d, #b9ab86); color: #333; }
  h2 { margin: 4px 0 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .cell { text-align: center; }
  .cell canvas { display: block; image-rendering: auto; }
  .note { opacity: .7; margin-top: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { BloodAtlas } from './textures.mjs';

const COLORS = ['#a51414d8', '#6a0e0ed8', '#f3900fd8', '#440707d8'];
const KINDS = ['splat', 'splash', 'smear', 'pool', 'droplet', 'footprint'];

function plate(kind, variant, color, size) {
  const src = BloodAtlas.tinted(kind, variant, color);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  // Color alpha is NOT baked into the plate (see tinted) — multiply at draw time
  g.globalAlpha = parseInt(color.slice(7, 9) || 'ff', 16) / 255;
  g.drawImage(src, 0, 0, size, size);
  return c;
}

// Scene sample: multiple stains with rotations/scales, matching renderer compositing
function sceneSample(color, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const rng = { s: 42, next() { this.s = (this.s + 0x6d2b79f5) >>> 0; let t = this.s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }, range(a, b) { return a + this.next() * (b - a); }, int(n) { return Math.floor(this.next() * n); } };
  const layout = [['splat', 12], ['splash', 4], ['smear', 5], ['pool', 4], ['droplet', 6]];
  const defs = [
    ['pool', 190, 0.5, 0.55, 0], ['splat', 130, 0.32, 0.4, 1.2], ['splat', 100, 0.68, 0.62, 3.6],
    ['smear', 150, 0.78, 0.3, 0.4], ['splash', 140, 0.25, 0.75, 1.8], ['droplet', 60, 0.85, 0.3, 2.4],
    ['splat', 70, 0.45, 0.78, 5.1], ['droplet', 44, 0.15, 0.8, 0.7]
  ];
  for (const [kind, s, fx, fy, rot] of defs) {
    const img = BloodAtlas.tinted(kind, rng.int(layout.find(([k]) => k === kind)[1]), color);
    const x = fx * size, y = fy * size;
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    // 0.9 stain record opacity × color alpha (not baked into the plate)
    g.globalAlpha = 0.9 * (parseInt(color.slice(7, 9) || 'ff', 16) / 255);
    g.drawImage(img, -s / 2, -s / 2, s, s);
    g.restore();
  }
  return c;
}

function buildBand(cls, title) {
  const band = document.createElement('div');
  band.className = `band ${cls}`;
  band.innerHTML = `<h2>${title}</h2>`;
  const root = document.createElement('div');
  root.className = 'row';
  band.appendChild(root);
  document.getElementById('root').appendChild(band);
  return root;
}

// Materials band: single shape across three substances
function buildMaterialsBand() {
  const band = document.createElement('div');
  band.className = 'band paper';
  band.innerHTML = '<h2>Materials — blood · mud · snow</h2>';
  const row = document.createElement('div');
  row.className = 'row';
  const mats = [
    ['blood', '#a51414d8', 0],
    ['mud', '#5c4326cc', 1],
    ['snow', '#e8ecf2e0', 2]
  ];
  for (const [name, col, m] of mats) {
    for (const [kind, v] of [['splat', 0], ['smear', 0], ['pool', 0]]) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const c = document.createElement('canvas');
      c.width = c.height = 190;
      const pg = c.getContext('2d');
      pg.globalAlpha = parseInt(col.slice(7, 9) || 'ff', 16) / 255;
      pg.drawImage(BloodAtlas.tinted(kind, v, col, m), 0, 0, 190, 190);
      cell.appendChild(c);
      const cap = document.createElement('div');
      cap.textContent = `${name} · ${kind}`;
      cell.appendChild(cap);
      row.appendChild(cell);
    }
  }
  band.appendChild(row);
  document.getElementById('root').appendChild(band);
}

for (const [cls, title] of [['paper', 'Parchment / light map'], ['dark', 'Dark scene']]) {
  const row = buildBand(cls, title);
  for (const kind of KINDS) {
    const n = BloodAtlas.kindCount(kind);
    const picks = kind === 'splat' ? [0, 3, 7, 11] : kind === 'smear' ? [0, 2, 4] : [0, 1, 2];
    for (let vi = 0; vi < Math.min(n, picks.length + 2); vi++) {
      const v = picks[vi] ?? vi;
      if (v >= n) continue;
      const color = COLORS[vi % COLORS.length];
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.appendChild(plate(kind, v, color, 190));
      const cap = document.createElement('div');
      cap.textContent = `${kind}[${v}]`;
      cell.appendChild(cap);
      row.appendChild(cell);
    }
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(sceneSample('#a51414d8', 190));
    const cap = document.createElement('div');
    cap.textContent = 'scene';
    cell.appendChild(cap);
    row.appendChild(cell);
  }
}
buildMaterialsBand();
window.__atlasReady = true;
</script>
</body>
</html>
